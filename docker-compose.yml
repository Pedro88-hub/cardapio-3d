services:
  postgres:
    image: postgres:16-alpine
    container_name: cardapio_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: cardapio
      POSTGRES_PASSWORD: cardapio
      POSTGRES_DB: cardapio
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
